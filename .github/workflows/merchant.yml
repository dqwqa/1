name: 洛克王国远行商人监控

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0 * * *'
    - cron: '5 4 * * *'
    - cron: '5 8 * * *'
    - cron: '5 12 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: roco-merchant-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
      ALERT_EMAIL: 15862845902@163.com
      SMTP_HOST: smtp.163.com
      SMTP_PORT: '465'
      SMTP_SECURE: 'true'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 应用实时主源优先策略
        run: node apply-source-policy.mjs

      - name: 永久保存主源优先修复
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add watcher.mjs
          if git diff --cached --quiet; then
            echo '主程序已经包含实时主源优先策略'
            exit 0
          fi
          git commit -m 'fix: make fresh onebiji data authoritative [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 手动运行时执行单元测试
        if: github.event_name == 'workflow_dispatch'
        run: npm test

      - name: 检查远行商人
        id: merchant
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node watcher.mjs

      - name: 保存最新状态
        if: always()
        continue-on-error: true
        run: |
          if [ ! -d status ]; then
            echo '没有状态文件需要保存'
            exit 0
          fi

          cp -R status /tmp/merchant-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf status
            cp -R /tmp/merchant-status status
            git add status/

            if git diff --cached --quiet; then
              echo '状态没有变化'
              exit 0
            fi

            git commit -m 'chore: update merchant status [skip ci]'
            if git push origin HEAD:main; then
              echo '状态保存成功'
              exit 0
            fi

            echo "第 ${attempt} 次保存失败，准备重试"
            sleep 3
          done

          echo '状态暂时未能写回仓库，但不影响本轮商品检查和邮件提醒'
          exit 0

      - name: 汇总监控结果
        if: always()
        run: |
          if [ "${{ steps.merchant.outcome }}" = "failure" ]; then
            echo '本轮主源读取未通过可靠性校验；详情已写入运行日志，程序会创建失败 Issue。'
          else
            echo '本轮商品读取完成；辅助源仅供参考，不会阻断提醒。'
          fi
