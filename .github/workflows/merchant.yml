name: 洛克王国远行商人监控

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0 * * *'
    - cron: '5 4 * * *'
    - cron: '5 8 * * *'
    - cron: '5 12 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: roco-merchant-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
      ALERT_EMAIL: 15862845902@163.com
      SMTP_HOST: smtp.163.com
      SMTP_PORT: '465'
      SMTP_SECURE: 'true'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 运行单元测试
        run: npm test

      - name: 检查远行商人
        id: merchant
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node watcher.mjs

      - name: 保存最新状态
        if: always()
        run: |
          if [ ! -d status ]; then
            echo '没有状态文件需要保存'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/
          if git diff --cached --quiet; then
            echo '状态没有变化'
            exit 0
          fi
          git commit -m 'chore: update merchant status [skip ci]'
          git push

      - name: 汇总监控结果
        if: always()
        run: |
          if [ "${{ steps.merchant.outcome }}" = "failure" ]; then
            echo '本轮商品读取未通过可靠性校验；详情已写入 status/latest.json，并由程序创建失败 Issue。'
          else
            echo '本轮商品读取完成。'
          fi
