name: 洛克王国远行商人监控

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0,4,8,12 * * *'

permissions:
  contents: write
  issues: write

jobs:
  merchant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install chromium
      - run: node watcher.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          ALERT_EMAIL: 15862845902@163.com
      - name: 保存状态
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add status || true
          git commit -m "chore: update merchant status" || true
          git push || true
